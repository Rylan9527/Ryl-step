<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}步数管理{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <!-- 侧边栏导航 -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i class="bi bi-activity"></i>
        <span>Zepp Life 步数管理</span>
      </div>
      <ul class="nav flex-column nav-menu">
        <li class="nav-item">
          <a class="nav-link {% if active=='manual' %}active{% endif %}" href="/">
            <i class="bi bi-hand-index-thumb"></i><span>手动同步</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active=='auto' %}active{% endif %}" href="/auto/manage">
            <i class="bi bi-clock-history"></i><span>自动管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active=='batch' %}active{% endif %}" href="/batch/import">
            <i class="bi bi-upload"></i><span>批量导入</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active=='history' %}active{% endif %}" href="/history">
            <i class="bi bi-list-ul"></i><span>历史记录</span>
          </a>
        </li>
      </ul>
    </nav>
    <!-- 主内容区 -->
    <div class="main-content">
      <div class="content-header">
        <button class="btn btn-sm btn-outline-secondary d-md-none" id="toggleSidebar">
          <i class="bi bi-list"></i>
        </button>
        <h4 class="mb-0">{% block page_title %}{% endblock %}</h4>
      </div>
      <div class="container-fluid py-4">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 移动端侧边栏切换
    document.getElementById('toggleSidebar')?.addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('show');
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
