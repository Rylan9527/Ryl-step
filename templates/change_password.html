{% extends 'base.html' %}
{% block title %}修改密码{% endblock %}
{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px;">
  <div class="card-body">
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('change_password') }}">
      <div class="mb-3">
        <label class="form-label">当前密码 <span class="text-danger">*</span></label>
        <input type="password" class="form-control" name="current_password" required placeholder="请输入当前密码">
      </div>
      <div class="mb-3">
        <label class="form-label">新密码 <span class="text-danger">*</span></label>
        <input type="password" class="form-control" name="new_password" required minlength="6" placeholder="至少6位">
      </div>
      <div class="mb-3">
        <label class="form-label">确认新密码 <span class="text-danger">*</span></label>
        <input type="password" class="form-control" name="confirm_password" required minlength="6" placeholder="再次输入新密码">
      </div>
      <button type="submit" class="btn btn-primary w-100">确认修改</button>
    </form>
  </div>
</div>
{% endblock %}
